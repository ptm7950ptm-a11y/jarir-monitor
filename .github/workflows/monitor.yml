name: jarir-monitor

on:
  schedule:
    - cron: "7 */2 * * *"        # every 2 hours (GitHub may delay it a few minutes); change as you like
  workflow_dispatch:              # manual run button

concurrency:
  group: jarir-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Riyadh
      DATA_DIR: data
      JARIR_BROWSER_FALLBACK: "0"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        run: python jarir_monitor_cloud.py --once
      - name: Build pages
        if: always()
        run: |
          python price_report.py
          [ -f data/offers_jarir.html ] && cp data/offers_jarir.html docs/offers.html || true
      - name: Save data
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || { git commit -m "data $(date -u +'%F %H:%M')"; git pull --rebase; git push; }
